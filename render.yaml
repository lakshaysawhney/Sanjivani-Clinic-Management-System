services:
  - type: web
    name: sanjivani-clinic-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90 --access-logfile - --access-logformat '%(m)s %(U)s %(s)s %(L)s'
    healthCheckPath: /api/health/
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: MAINTENANCE_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ACCOUNTING_START_DATE
        value: '2026-10-28'
