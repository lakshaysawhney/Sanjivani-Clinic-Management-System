name: Clinic verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: clinic_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: '1'
      DJANGO_SECRET_KEY: synthetic-ci-key-never-for-production
      DATABASE_URL: postgresql://clinic:synthetic-ci-only@localhost:5432/clinic_dev
      ACCOUNTING_START_DATE: '2026-10-01'
      E2E_PASSWORD: synthetic-browser-only-Password-482!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm run build
        working-directory: frontend
      - run: python scripts/check_public.py
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py seed_demo
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
