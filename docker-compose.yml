services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: clinic_dev
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - clinic_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinic -d clinic_dev']
      interval: 5s
      retries: 10
volumes:
  clinic_dev:
